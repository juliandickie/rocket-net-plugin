      example: '2024-01-01T02:00:00Z'
    CustomSSLRequest:
      title: CustomSSLRequest
      type: object
      properties:
        domains:
          type: array
          description: a list of domains belonging to this site that this certificate will support
          items:
            type: string
          example:
            - custom-ssl.com
            - www.custom-ssl.com
            - subdomain.custom-ssl.com
        certificate:
          type: string
          description: the ssl certificate to use for each domain
          example: |-
            -----BEGIN CERTIFICATE-----
            MAoGCCqGSM49BAMD...
            -----END CERTIFICATE-----
        key:
          type: string
          description: the certificate private key
          example: |-
            -----BEGIN PRIVATE KEY-----
            MIGHAgEAMBMGByqG...
            -----END PRIVATE KEY-----
      required:
        - domains
        - certificate
        - key
    CustomSSLResponse:
      title: CustomSSLResponse
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: custom ssl record identifier
          example: 1634ccc1-14a2-46b6-b886-95bdcc2efdab
        site_id:
          type: integer
          description: id of the site associated with custom ssl record
          example: 12345
        serial_number:
          type: string
          description: the serial number of this custom ssl certificate
          example: 398afaa14450d29e7a0905519a3e94cd0
        fingerprint:
          type: string
          description: the SHA256 fingerprint of this custom ssl certificate
          example: 1661186b8e38e79f434e4549a2d53f84716cfff7c45d334bbc67c9d41d1e3be6
        issuer:
          type: string
          description: the issuer of this custom ssl certificate
          example: LetsEncrypt
        uploaded_on:
          type: string
          format: date-time
          description: the date this custom ssl certificate was uploaded
          example: '2026-01-07 18:31:22'
        issued_on:
          type: string
          format: date-time
          description: the date this custom ssl certificate was issued
          example: '2026-01-05 20:49:35'
        expires_on:
          type: string
          format: date-time
          description: the date this custom ssl certificate will expire
          example: '2026-03-06 20:49:35'
        domains:
          type: array
          description: the Rocket.net domains that are associated with this custom ssl certificate
          items:
            type: string
          example:
            - custom-ssl.com
            - www.custom-ssl.com
            - subdomain.custom-ssl.com
