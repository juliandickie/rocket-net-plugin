                example: '<p>The best anti-spam protection to block spam comments and spam in a contact form. The most trusted antispam solution for WordPress and WooCommerce.</p> <p>Akismet checks your comments and contact form submissions against our global database of spam to prevent your site from publishing malicious content. You can review the comment spam it catches on your blog&#8217;s &#8220;Comments&#8221; admin screen.</p> <p>Major features in Akismet include:</p> <ul> <li>Automatically checks all comments and filters out the ones that look like spam.</li> <li>Each comment has a status history, so you can easily see which comments were caught or cleared by Akismet and which were spammed or unspammed by a moderator.</li> <li>URLs are shown in the comment body to reveal hidden or misleading links.</li> <li>Moderators can see the number of approved comments for each user.</li> <li>A discard feature that outright blocks the worst spam, saving you disk space and speeding up your site.</li> </ul> <p>PS: You&#8217;ll be prompted to get an Akismet.com API key to use it, once activated. Keys are free for personal blogs; paid subscriptions are available for businesses and commercial sites.</p> '
              active_installs:
                type: integer
                description: Number of current installations of this plugin
                example: 1000000
