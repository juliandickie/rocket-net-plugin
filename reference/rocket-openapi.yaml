          description: Date the invoice was created
          example: '2024-05-21'
        due_date:
          type: string
          description: Date the invoice is due
          example: '2024-05-21'
        payment:
          type: object
          properties:
            status:
              type: string
              enum:
                - Collections
                - Payment Pending
                - Paid
                - Refunded
                - Unpaid
              example: Unpaid
            date_paid:
              type: string
              description: If paid, the date upon when the payment was made
              example: '2024-05-21 11:13:10'
            last_capture_attempt:
              type: string
              description: Date when the last payment was attempted to be captured
              example: '2024-05-21 11:13:10'
            date_refunded:
              type: string
              description: If the invoice has been refunded, the date upon which that happened
              example: '2024-05-21 11:13:10'
            date_cancelled:
              type: string
              description: If the invoice has been cancelled, the date upon which that happened
              example: '2024-05-21 11:13:10'
