  /v1/reporting/sites/{id}/waf/eventlist:
    get:
      operationId: app.controllers.reporting_controller.reporting_sites_id_waf_eventlist_get
      summary: List WAF Events
      description: Lists all requests which triggered actions in the Web Application Firewall (WAF)
      tags:
        - Reporting
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          schema:
            $ref: '#/components/schemas/SiteID'
          required: true
        - in: query
          name: duration
          schema:
            $ref: '#/components/schemas/ReportingDuration'
          required: true
        - in: query
          name: search
          schema:
            description: Search for an event by action, client_ip, country, request_path, user_agent, or query_string
            type: string
            example: /admin-ajax.php
        - in: query
          name: action
          description: Filter events matching a specific action taken by the WAF
          style: form
          schema:
            type: array
            example:
              - allow
            items:
              type: string
              enum:
                - allow
                - block
                - bypass
                - challenge
                - jschallenge
                - managed_challenge
                - skip
          required: false
        - in: query
          name: client_ip
          description: Filter events matching a specific IP address
          schema:
            type: string
            example: 1.2.3.4
          required: false
        - in: query
          name: request_path
          description: Filter events matching a specific request path or partial path
          schema:
            type: string
            example: /wp-login.php
          required: false
        - in: query
          name: country
          description: Filter events matching a specific country
          schema:
            type: array
            example:
              - US
            items:
              type: string
          required: false
        - in: query
          name: asn
          description: Filter events matching a specific ASN
          schema:
            type: string
            example: '14618'
          required: false
        - in: query
          name: asn_description
          description: Filter events matching a specific or partial ASN description
          schema:
            type: string
            example: AMAZON-AES
          required: false
        - in: query
          name: http_method
          description: Filter events matching a specific HTTP method
          schema:
            type: array
            example:
              - POST
            items:
              type: string
              enum:
                - GET
                - DELETE
                - HEAD
                - OPTIONS
                - PATCH
                - PUT
                - POST
          required: false
        - in: query
          name: http_protocol
          description: Filter events matching a specific or partial HTTP Protocol
          schema:
            type: string
            example: HTTP/1.1
          required: false
        - in: query
          name: query_string
          description: Filter events matching a specific or partial Query String
          schema:
            type: string
            example: '&bad=request'
          required: false
        - in: query
          name: ray_id
          description: Filter events matching a specific or partial Ray ID
          schema:
            type: string
            example: '1234567890'
          required: false
        - in: query
          name: user_agent
          description: Filter events matching a specific or partial HTTP User Agent
          schema:
            type: string
            example: Mozilla/5.0
          required: false
        - in: query
          name: per_page
          schema:
            $ref: '#/components/schemas/PerPage'
          required: false
        - in: query
          name: page
          schema:
            $ref: '#/components/schemas/Page'
          required: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListWAFEventsResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not authorized to access endpoint
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Given site not found for user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
