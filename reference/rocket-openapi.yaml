            allOf:
              - $ref: '#/components/schemas/CountStringMetric'
              - type: object
                properties:
                  metric:
                    type: string
                    example: GET
        topASNs:
          description: Which autonomous systems (ASNs) direct the most traffic to your site
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/CountStringMetric'
              - type: object
                properties:
                  metric:
                    type: string
                    example: 15169 - GOOGLE
        topBrowsers:
          description: Which web browsers are most used to view your site
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/CountStringMetric'
              - type: object
                properties:
                  metric:
                    type: string
                    example: ChromeMobile
        topCacheStatuses:
          description: Which CDN cache status are most often encountered by visitors
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/CountStringMetric'
              - type: object
                properties:
                  metric:
                    type: string
                    example: hit
                    enum:
                      - dynamic
                      - expired
                      - hit
                      - miss
                      - none
        topClientIPs:
          description: Which IP addresses most of the requests to your site come from
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/CountStringMetric'
              - type: object
                properties:
                  metric:
                    type: string
                    example: 1.2.3.4
        topColoCodes:
          description: Which CDN point-of-presence is handling the most requests for your site
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/CountStringMetric'
              - type: object
                properties:
                  metric:
                    type: string
                    example: CDG
        topDeviceTypes:
          description: Which types of devices are most often visiting your site
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/CountStringMetric'
              - type: object
                properties:
                  metric:
                    type: string
                    example: desktop
                    enum:
                      - desktop
                      - mobile
                      - tablet
        topEdgeStatusCodes:
          description: The status codes most often returned by our Edge network
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/CountIntegerMetric'
              - type: object
                properties:
                  metric:
                    type: integer
                    example: 200
        topHTTPProtocolVersions:
          description: Which HTTP protocol versions your visitors are most requesting
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/CountStringMetric'
              - type: object
                properties:
                  metric:
                    type: string
                    example: HTTP/2
                    enum:
                      - HTTP/3
                      - HTTP/2
                      - HTTP/1.1
                      - HTTP/1.0
        topHosts:
          description: Which domain names are most requested for your site
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/CountStringMetric'
              - type: object
                properties:
                  metric:
                    type: string
                    example: rocket.net
        topOSes:
          description: Which operating systems are most of your visitors using
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/CountStringMetric'
              - type: object
                properties:
                  metric:
                    type: string
                    example: Android
        topOriginStatusCodes:
          description: The status codes most often returned by the origin server hosting your site
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/CountIntegerMetric'
              - type: object
                properties:
                  metric:
                    type: integer
                    example: 200
        topPaths:
          description: Which paths (URIs) visitors are requesting the most
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/CountStringMetric'
              - type: object
                properties:
                  metric:
                    type: string
                    example: /blog
        topReferers:
          description: Which domains send the most traffic to your site
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/CountStringMetric'
              - type: object
                properties:
                  metric:
                    type: string
                    example: google.com
        topUserAgents:
          description: Which User Agents make the most requests to your site
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/CountStringMetric'
