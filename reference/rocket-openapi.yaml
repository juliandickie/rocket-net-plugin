          description: Any account credits that were applied to the invoice
          example: 0
        items:
          type: array
          description: Items on the invoice
          items:
            $ref: '#/components/schemas/BillingInvoiceItem'
        transactions:
          type: array
          description: Transactions related to the invoice
          items:
            $ref: '#/components/schemas/BillingInvoiceTransaction'
