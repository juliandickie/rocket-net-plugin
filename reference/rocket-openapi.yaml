    url: http://www.rocket.net
    email: support@rocket.net
servers:
  - url: https://api.rocket.net
tags:
  - name: Billing
    description: Manage orders and billing
  - name: Authentication
    description: Create a JWT
  - name: Sites
    description: Manage your WordPress Sites
  - name: Site Templates
    description: Use templates to Clone / Create sites with pre-defined options
  - name: Partner
    description: Manage your site with partner options
  - name: Domains
    description: Manage your Site's Domains
  - name: CDN Cache
    description: Manage your Site's CDN Cache
  - name: FTP Accounts
    description: Manage your Site's FTP Accounts
  - name: Plugins
    description: Manage your Site's Plugins
  - name: Themes
    description: Manage your Site's Themes
  - name: Reporting
    description: View reporting for your Sites
  - name: SSH Keys
    description: Manage your Site's SSH Keys
  - name: Custom SSL
    description: Manage Custom SSL Certificates
  - name: Visitors
    description: View unique visitor statistics for site or account
  - name: Bandwidth
    description: View bandwidth usage over time for site or account
  - name: Cloud Backups
    description: Manage your Site's cloud backups
  - name: Backups
    description: Manage your Site's backups
  - name: Files
    description: Manage your Site's files
  - name: Account
    description: Get Information about your Rocket.net Account
  - name: Activity
    description: Manage Site's activity
  - name: Site Users
    description: Manage Site's users
  - name: Password Protection
    description: Manage password protection for sites
  - name: Password Strength
    description: Check password strength against requirements
  - name: Account Users
    description: Manage additional users for your Account
  - name: ShopShield
    description: Protect your site from traffic bursts
  - name: Site Transfers
    description: Manage site transfers between accounts
  - name: WordPress
    description: Interact with your site's WordPress installation
