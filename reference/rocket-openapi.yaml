    CDNURL:
      title: CDNURL
      type: string
      description: CDN URL that can be used to view the site before it goes live
      example: 88888888p.onrocket.site
    SFTPIPAddress:
      title: SFTPIPAddress
      type: string
      description: SSH (if enabled) and FTP (w/ TLS) IP Address used to connect to the site
      example: 192.168.1.1
    SFTPUsername:
      title: SFTPUsername
      type: string
      description: Username used to log into SFTP (and/or SSH, if enabled)
      example: userabcd1234
    SiteDiskUsage:
      title: SiteDiskUsage
      type: integer
      description: Disk usage in kb
      example: 1000000
    SiteStatus:
      title: SiteStatus
      type: string
      description: Status of the site
      enum:
        - active
        - deleting
        - pending
        - locked
      example: active
    PartnerSiteType:
      title: PartnerSiteType
      type: integer
      description: Type of site. 0 == WordPress, 1 == static site, 2 == AI Builder
      enum:
        - 0
        - 1
        - 2
    SiteLabel:
      type: string
      description: A label which can be used to identify the site separately from the site's domain
      nullable: true
      example: agencypartner1::site1::abcd
    LocationID:
      title: LocationID
      type: integer
      description: ID of the location. Use the List Site locations API to get the location ID.
      example: 1
    WordPressAdminUsername:
      title: WordPressAdminUsername
      type: string
      description: WordPress admin username
      example: superlongadminusername
    WordPressAdminPassword:
      title: WordPressAdminPassword
      type: string
      description: WordPress admin password
      example: b38yt3M#ORJ#nu3gh3irj3hrug###D%
    WordPressAdminEmail:
      title: WordPressAdminEmail
      type: string
      description: WordPress admin email
      example: email@domain.tld
    WordPressMultisite:
      title: WordPressMultisite
      type: boolean
      description: 'If the site will use WordPress Multisite: https://wordpress.org/documentation/article/wordpress-glossary/#multisite'
      example: true
    SiteType:
      title: SiteType
      type: integer
      description: Type of site. 0 == WordPress, 1 == static site
      enum:
        - 0
        - 1
        - 2
    BaseDomain:
      type: string
      description: Base domain without any subdomains. Example is for sub.domain.tld
      example: domain.tld
    CustomSSL:
      nullable: true
      description: custom ssl information for this domain. ssl is managed by Cloudflare if not present
      oneOf:
        - $ref: '#/components/schemas/CustomSSLResponse'
        - $ref: '#/components/schemas/NullType'
      example:
        id: 1634ccc1-14a2-46b6-b886-95bdcc2efdab
        site_id: 12345
        serial_number: 398afaa14450d29e7a0905519a3e94cd0
        fingerprint: 1661186b8e38e79f434e4549a2d53f84716cfff7c45d334bbc67c9d41d1e3be6
        issuer: LetsEncrypt
        uploaded_on: '2026-01-07 18:31:22'
        issued_on: '2026-01-05 20:49:35'
        expires_on: '2026-03-06 20:49:35'
    CertificateAuthority:
      title: CertificateAuthority
      type: string
      description: Certificate Authority that was used to issue SSL certificates for the site
      example: google
      enum:
        - google
        - lets_encrypt
        - ssl_com
        - digicert
    DisplayDomain:
      type: string
      description: Full domain name of the domain (UTF-8 characters present)
      example: sub.domain.tld
    Domain:
      type: string
      description: Full domain name of the domain (UTF-8 converted to punycode)
      example: sub.domain.tld
    DomainType:
      type: string
      description: Type of domain (normal = apex [i.e. domain.tld], subdomain = subdomain other than www, www = www.$domain)
      enum:
        - normal
        - subdomain
        - www
    SubDomain:
      type: string
      description: If this domain is a sub-domain this will be the sub-domain value. Otherwise it will be the domain without TLD. Example is for sub.domain.tld
      example: sub
    ReportingDurationInt:
      type: integer
      description: Number of hours to provide logs for
      example: 48
      enum:
        - 1
        - 6
        - 12
        - 24
        - 48
        - 72
    EdgeSettingAllowFalse:
      description: Whether the type of visitor/traffic is allowed
      type: boolean
      example: false
      default: false
    EdgeSettingAvailable:
      description: Whether the edge setting can be used. False means the edge setting is not available for use.
      type: boolean
      example: false
    EdgeSettingEnabledFalse:
      description: Whether the edge setting is enabled
      type: boolean
      example: false
      default: false
    EdgeSettingsWAFBypass:
      title: EdgeSettingsWAFBypass
      type: object
      description: Bypassing the WAF for users logged into WordPress
      properties:
        enabled:
          $ref: '#/components/schemas/EdgeSettingEnabledFalse'
        available:
          $ref: '#/components/schemas/EdgeSettingAvailable'
    EdgeSettingsUserAgentEmptySettings:
      title: EdgeSettingsUserAgentEmptySettings
      type: object
      description: Whether empty user-agents are allowed to access the site
      properties:
        allow:
          $ref: '#/components/schemas/EdgeSettingAllowFalse'
        available:
          $ref: '#/components/schemas/EdgeSettingAvailable'
    EdgeSettingsUserAgentGoHttpClientSettings:
      title: EdgeSettingsUserAgentGoHttpClientSettings
      type: object
      description: Whether go-http-client user-agents are allowed to access the site
      properties:
        allow:
          $ref: '#/components/schemas/EdgeSettingAllowFalse'
        available:
          $ref: '#/components/schemas/EdgeSettingAvailable'
    EdgeSettingsLoginRegistrationProtection:
      title: EdgeSettingsLoginRegistrationProtection
      description: Protects WooCommerce login and registration from being accessed by untrusted sources via a managed challenge
      type: object
      properties:
        enabled:
          $ref: '#/components/schemas/EdgeSettingEnabledFalse'
        available:
          $ref: '#/components/schemas/EdgeSettingAvailable'
    EdgeSettingEnabledTrue:
      description: Whether the edge setting is enabled
      type: boolean
      example: false
      default: false
    EdgeSettingsWPLoginChallenge:
      title: EdgeSettingsWPLoginChallenge
      type: object
      description: Whether managed challenges are issued on login attempts to wp-login.php
      properties:
        enabled:
          $ref: '#/components/schemas/EdgeSettingEnabledTrue'
        available:
          $ref: '#/components/schemas/EdgeSettingAvailable'
    FeaturedPlugin:
      title: FeaturedPlugin
      type: object
      properties:
        name:
          $ref: '#/components/schemas/PluginName'
        description:
          type: string
          description: Description of the featured plugin
        uninstall_description:
          type: string
          description: Description of the featured plugin after it has been installed
        icons:
          type: object
          description: Icons of various sizes
          properties:
            1x:
              type: string
              description: Link to a 128x128px plugin icon
              example: https://ps.w.org/akismet/assets/icon-128x128.png?rev=2818463
            2x:
              type: string
              description: Link to a 256x256px plugin icon
              example: https://ps.w.org/akismet/assets/icon-256x256.png?rev=2818463
        status:
          type: string
          description: Plugin status
          enum:
            - active
            - inactive
            - not_installed
        update:
          type: string
          description: If the plugin has any updates available
          example: none
          enum:
            - available
            - none
        version:
          $ref: '#/components/schemas/PluginVersion'
        title:
          $ref: '#/components/schemas/PluginTitle'
    ListFeaturedPluginsResult:
      title: ListFeaturedPluginsResult
      type: object
      properties:
        result:
          type: array
          items:
            $ref: '#/components/schemas/FeaturedPlugin'
    ListFeaturedPluginsResponse:
      title: ListFeaturedPluginsResponse
      allOf:
        - $ref: '#/components/schemas/BasicResponse'
        - $ref: '#/components/schemas/Metadata'
        - $ref: '#/components/schemas/ListFeaturedPluginsResult'
    QuotaSetter:
      title: QuotaSetter
      type: integer
      description: FTP disk space quota in MB (0 = unlimited)
      example: 500
      default: 0
    SiteTaskMetaDataDict:
      title: SiteTaskMetaDataDict
      type: object
      example:
        cloned_site_id: 1234567890
        template_replacements:
          - key: __CONTACT_EMAIL__
            value: hello@rocket.net
      properties:
        meta_data:
          $ref: '#/components/schemas/SiteMetadata'
    SiteTemplateID:
      title: SiteTemplateID
      type: string
      description: Unique ID (UUID) of the site template
      example: 7ec25c75-b490-4365-bc55-7df7f1aa7c5e
      format: uuid
    SiteUserSite:
      title: SiteUserSite
      type: object
      properties:
        id:
          type: integer
          description: ID of the Site the Site User has access to
          example: 8880000888
        domain:
          type: string
          description: Domain of the Site the Site User has access to (UTF-8 via punycode)
          example: some.domain.tld
        display_domain:
          type: string
          description: Display domain of the Site the Site User has access to (UTF-8 supported)
          example: some.domain.tld
        rocket_url:
          type: string
          description: Rocket URL of the Site the Site User has access to
          example: abcd.onrocket.com
        location:
          type: string
          description: Location of the Site the Site User has access to
          example: NL - Amsterdam
        ftp_ip_address:
          type: string
          description: FTP IP address of the Site the Site User has access to
          example: 123.456.789.012
        sftp_username:
          type: string
          description: SFTP username of the Site the Site User has access to
          example: siteuser
        disk_usage:
          type: integer
          description: Disk usage of the Site the Site User has access to
          example: 100000000
        created_at:
          $ref: '#/components/schemas/CreatedAt'
        production:
          type: integer
          description: If the site is a production site (1) or a staging site (0)
          enum:
            - 0
            - 1
        staging:
          type: object
          properties:
            staging_id:
              type: integer
              description: ID of the staging site
              example: 1234567890
            staging_status:
              type: string
              description: Status of the staging site
              enum:
                - active
                - deleting
                - pending
                - locked
        site_type:
          type: integer
          description: Type of site. 0 == WordPress, 1 == static site
          enum:
            - 0
            - 1
        label:
          type: string
          description: Label of the Site
          example: some.domain.tld
        metadata:
          type: string
          description: Metadata tagged to the Site
          example: '{"some": "metadata"}'
        status:
          type: string
          description: Status of the Site
          enum:
            - Active
            - Declined
            - Invited
        status_reason:
          $ref: '#/components/schemas/SiteStatusReason'
    SiteUsersSiteList:
      title: SiteUsersSiteList
      type: object
      properties:
        result:
          type: array
          items:
            $ref: '#/components/schemas/SiteUserSite'
    ListSiteUserSitesResponse:
      title: ListSiteUserSitesResponse
      allOf:
        - $ref: '#/components/schemas/BasicListResponse'
        - $ref: '#/components/schemas/SiteUsersSiteList'
    PasswordStrengthResult:
      title: PasswordStrengthResult
      type: object
      properties:
        result:
          type: object
          properties:
            strength:
              type: integer
              description: Numerical representation of password strength
              example: 90
            strong:
              type: boolean
              description: Whether the given password is strong enough to be used on the platform
              example: true
    SetUserPasswordRequest:
      title: SetUserPasswordRequest
      type: object
      required:
        - password
      properties:
        password:
          type: string
          description: User password
