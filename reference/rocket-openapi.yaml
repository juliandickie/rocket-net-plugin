        - Account
      security:
        - bearerAuth: []
      requestBody:
        description: Create a hosting plan
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelAccountRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
